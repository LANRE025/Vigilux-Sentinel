# Vigilux Sentinel Frontend — nginx config for Cloud Run
# Serves the Vite SPA and forwards all unknown paths to index.html
# so client-side routing works.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that doesn't match a static file → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite hashes filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # gzip for text/css/js/json/svg.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;
}
